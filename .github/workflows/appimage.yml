name: Build AppImage

# =============================================================================
#  AppImage build workflow for Nickvision Parabolic (x86_64 only)
# =============================================================================
#  Builds a portable, size-optimized AppImage of Parabolic for any Linux
#  distribution with glibc >= 2.35 (Ubuntu 22.04+, Debian 12+, Fedora 36+, Arch).
#
#  Update chain:
#    1. .github/workflows/sync-upstream.yml runs daily (cron) — merges
#       nickvisionapps/parabolic:main into your fork's main
#    2. The merge push triggers THIS workflow (via `on: push: branches: [main]`)
#    3. This workflow builds the new AppImage and uploads it as an artifact
#    4. On tag push (v*.*.*), the AppImage is also attached to a GitHub Release
#    5. Bundled inside the AppImage is parabolic-updater.sh — a Yad-based
#       in-app updater that checks GitHub Releases for new versions
#
#  Size-reduction knobs (configured in env: block below):
#    BUNDLE_DENO=1                   # bundle deno (DEFAULT — yt-dlp requires it for JS extractors)
#    STRIP_BINARIES=1                # strip debug symbols from bundled ELF binaries (~30 MB savings)
#    REMOVE_PDB=1                    # delete .pdb / .dbg / .xml files from .NET publish dir (~10 MB savings)
#    SKIP_FFPLAY=1                   # don't bundle ffplay (Parabolic only needs ffmpeg + ffprobe, ~10 MB savings)
#    SHRINK_ICU=0                    # off by default — removing ICU breaks non-English locale formatting
#    FFMPEG_SOURCE=btbn               # default — BtbN master-latest (~140 MB, GitHub Releases, reliable)
#    FFMPEG_SOURCE=johnvansickle     # smaller (~40 MB) BUT Cloudflare-protected, may fail; auto-falls-back to BtbN
#
#  Expected output size with all defaults: ~171 MB (deno bundled by default)
#
#  Triggers:
#    - push to main/master in packaging/appimage/ or this workflow file
#    - manual dispatch (with optional parabolic_ref input)
#    - tag push matching v*.*.* (creates a GitHub Release with the AppImage attached)
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      parabolic_ref:
        description: "Parabolic git ref to build (branch / tag / SHA)"
        required: false
        default: "main"
        type: string
      ffmpeg_source:
        description: "ffmpeg source — btbn (~140 MB, GitHub Releases, reliable — DEFAULT) or johnvansickle (~40 MB, but Cloudflare-protected, auto-falls-back to btbn on failure)"
        required: false
        default: "btbn"
        type: choice
        options:
          - btbn
          - johnvansickle
  push:
    branches:
      - main
      - master
    paths:
      - "packaging/appimage/**"
      - ".github/workflows/appimage.yml"
    tags:
      - "v*.*.*"
      - "appimage-*"
  pull_request:
    paths:
      - "packaging/appimage/**"
      - ".github/workflows/appimage.yml"

# Concurrency control:
# We use `cancel-in-progress: false` (NOT true) so each push gets its own complete run.
# Setting `cancel-in-progress: true` would cancel any in-progress run when a new
# commit is pushed — which is bad for our use case because:
#   1. The user often pushes multiple "Hotfix ..." commits in quick succession
#   2. Each cancelled run never gets to actually verify whether the fix worked
#   3. The "Canceling since a higher priority waiting request exists" message
#      is confusing — looks like an apt failure but isn't.
# With `false`, runs queue up and execute in order — slower, but each one completes.
concurrency:
  group: appimage-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write  # needed for softprops/action-gh-release to upload AppImage to Release

# -----------------------------------------------------------------------------
#  Build configuration
# -----------------------------------------------------------------------------
env:
  ARCH: x86_64
  DOTNET_RID: linux-x64
  PARABOLIC_REF: ${{ inputs.parabolic_ref || 'main' }}
  # GitHub owner/repo where releases will be published — baked into the bundled
  # parabolic-updater.sh so it knows where to check for updates.
  # `${{ github.repository_owner }}` resolves to YOUR username (the fork owner),
  # so the AppImage will check YOUR fork's releases for updates.
  GITHUB_OWNER: ${{ github.repository_owner }}
  GITHUB_REPO: parabolic
  # Size-reduction knobs (default = smallest AppImage that still has all features
  # Parabolic + yt-dlp need; deno IS bundled because yt-dlp requires it for JS extractors).
  # Expected size: ~171 MB.
  BUNDLE_DENO: "1"  # always bundle deno — required by yt-dlp for JS-based extractors
  STRIP_BINARIES: "1"
  REMOVE_PDB: "1"
  SKIP_FFPLAY: "1"
  SHRINK_ICU: "0"
  # ffmpeg source — "btbn" (DEFAULT, GitHub Releases, ~140 MB, reliable)
  # or "johnvansickle" (~40 MB, but Cloudflare-protected — auto-falls-back to btbn if it fails)
  FFMPEG_SOURCE: ${{ inputs.ffmpeg_source || 'btbn' }}
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  build-appimage:
    name: Build x86_64 AppImage
    runs-on: ubuntu-latest
    # Run inside a Ubuntu 25.10 (plucky) container — has the correct versions of:
    #   - libgtk-4-dev 4.18.4 (Parabolic needs >= 4.17.5)
    #   - libadwaita-1-dev 1.7.0 (Parabolic needs >= 1.7 — uses Adw.ButtonRow, Adw.SpinnerPaintable)
    #   - blueprint-compiler 0.16.0 (Parabolic needs >= 0.10)
    # The host runner (ubuntu-latest = 24.04) only provides the kernel; all apt
    # installs happen inside the plucky container.
    #
    # NOTE: Docker Hub's `ubuntu:25.10` image currently resolves to Ubuntu 25.04 (questing),
    # which is the latest STABLE interim release. Plucky (25.10) is in development.
    # Questing is even better for our purposes — it ships libadwaita 1.8.0, GTK 4.20.1,
    # and blueprint-compiler 0.18.0.
    container:
      image: ubuntu:25.10
      options: --privileged  # needed for AppImage / FUSE operations in linuxdeploy
    steps:
      - name: Checkout fork
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up build dependencies (apt)
        # Inside the plucky/questing container, we have native access to all the recent
        # GTK/libadwaita versions Parabolic needs. No source-list rewriting,
        # no plucky backport pinning, no source builds.
        #
        # Package renames to be aware of (vs Ubuntu 24.04 noble):
        #   - `libgdk-pixbuf2.0-0` (transitional) → `libgdk-pixbuf-2.0-0` (with hyphen)
        #   - `libfreetype6-dev` → `libfreetype-dev` (the `6` was dropped from the dev pkg name)
        #   - `libpangocairo-1.0-dev` does NOT exist on Ubuntu (pangocairo dev files
        #     are bundled inside `libpango1.0-dev`)
        #
        # NOTE: Inside the container, we're root — no `sudo` prefix needed.
        run: |
          set +e  # we handle errors ourselves in the retry loops

          # First-time setup inside the container — the image ships with a very
          # minimal apt state, so we need to refresh.
          echo "=== apt-get update (with retries) ==="
          UPDATE_OK=0
          for attempt in 1 2 3 4 5; do
            echo ""
            echo "--- apt-get update attempt $attempt/5 ---"
            if apt-get update -y \
                  -o Acquire::Retries=5 \
                  -o Acquire::http::Timeout=60 \
                  -o Acquire::https::Timeout=60; then
              echo "✔ apt-get update succeeded on attempt $attempt"
              UPDATE_OK=1
              break
            fi
            if [ "$attempt" = "5" ]; then
              echo "⚠ apt-get update failed after 5 attempts — proceeding to install anyway"
            else
              echo "apt-get update failed on attempt $attempt. Sleeping 10s before retry..."
              sleep 10
            fi
          done

          echo ""
          echo "=== apt-get install (with retries) ==="
          INSTALL_OK=0
          for attempt in 1 2 3 4 5; do
            echo ""
            echo "--- apt-get install attempt $attempt/5 ---"
            if apt-get install -y \
                  -o Acquire::Retries=5 \
                  -o Acquire::http::Timeout=60 \
                  -o Acquire::https::Timeout=60 \
                  -o Dpkg::Options::="--force-confdef" \
                  -o Dpkg::Options::="--force-confold" \
                  sudo ca-certificates \
                  build-essential \
                  autoconf automake autotools-dev libtool pkg-config \
                  autopoint gettext \
                  meson ninja-build \
                  aria2 \
                  blueprint-compiler \
                  libglib2.0-dev-bin libglib2.0-dev \
                  libgtk-4-dev \
                  libadwaita-1-dev \
                  libgdk-pixbuf-2.0-dev libgdk-pixbuf-2.0-0 libgdk-pixbuf2.0-bin \
                  libgirepository1.0-dev python3-gi \
                  desktop-file-utils \
                  libssl-dev libc-ares-dev libxml2-dev zlib1g-dev \
                  libsqlite3-dev \
                  libgraphene-1.0-dev libepoxy-dev \
                  libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
                  libpango1.0-dev \
                  libcairo2-dev \
                  libfribidi-dev libharfbuzz-dev libfreetype-dev libfontconfig1-dev \
                  libpixman-1-dev libffi-dev libpcre2-dev \
                  binutils file \
                  git curl wget unzip tar; then
              echo "✔ apt-get install succeeded on attempt $attempt"
              INSTALL_OK=1
              break
            fi
            if [ "$attempt" = "5" ]; then
              echo "::error::apt-get install failed after 5 attempts."
              echo "::error::Most likely cause: a broken package on Ubuntu 25.04/25.10."
              echo "::error::Workarounds:"
              echo "::error::  - Re-run the workflow (Actions tab → Re-run failed jobs)"
              echo "::error::  - Check https://github.com/actions/runner-images/issues for known outages"
              exit 100
            fi
            echo "apt-get install failed on attempt $attempt. Sleeping 15s before retry..."
            sleep 15
          done

          if [ "$INSTALL_OK" != "1" ]; then
            echo "::error::apt-get install did not complete successfully"
            exit 100
          fi
          echo ""
          echo "✔ All packages installed successfully"
          echo ""
          echo "=== Verify libadwaita version (should be 1.8.0) ==="
          dpkg -l libadwaita-1-dev | tail -2
          echo ""
          echo "=== Verify libgtk-4 version (should be 4.20.x) ==="
          dpkg -l libgtk-4-dev | tail -2
          echo ""
          echo "=== blueprint-compiler version (should be 0.18.0) ==="
          blueprint-compiler --version

      - name: "Install blueprint-compiler (fallback: build from source if too old)"
        # Plucky ships blueprint-compiler 0.16.0 which is recent enough for Parabolic.
        # This step only runs if the apt-installed version is somehow missing or too old.
        # Note: the upstream git tag is `v0.10.0` (WITH v prefix), not `0.10.0`.
        run: |
          if ! command -v blueprint-compiler >/dev/null 2>&1; then
            echo "Building blueprint-compiler from source (not installed via apt)..."
            git clone --depth 1 --branch v0.10.0 https://gitlab.gnome.org/GNOME/blueprint-compiler.git /tmp/bpc
            (cd /tmp/bpc && meson setup build --prefix=/usr && ninja -C build && ninja -C build install)
          elif ! blueprint-compiler --version 2>/dev/null | grep -qE '0\.(1[0-9]|[2-9][0-9])\.'; then
            echo "Installed blueprint-compiler is too old, building v0.10.0 from source..."
            echo "Current version: $(blueprint-compiler --version 2>&1)"
            apt-get remove -y blueprint-compiler 2>/dev/null || true
            git clone --depth 1 --branch v0.10.0 https://gitlab.gnome.org/GNOME/blueprint-compiler.git /tmp/bpc
            (cd /tmp/bpc && meson setup build --prefix=/usr && ninja -C build && ninja -C build install)
          else
            echo "✔ blueprint-compiler already installed: $(blueprint-compiler --version 2>&1)"
          fi

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "ga"

      - name: Cache bundled dependencies (yt-dlp, ffmpeg, deno, curl-impersonate, aria2)
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: packaging/appimage/build/deps
          key: appimage-deps-x86_64-${{ hashFiles('packaging/appimage/build-appimage.sh') }}-${{ github.run_id }}
          restore-keys: |
            appimage-deps-x86_64-
            appimage-deps-

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-x86_64-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-x86_64-

      - name: Print build configuration
        run: |
          echo "=== Build configuration ==="
          echo "  ARCH:           $ARCH"
          echo "  DOTNET_RID:     $DOTNET_RID"
          echo "  PARABOLIC_REF:  $PARABOLIC_REF"
          echo "  FFMPEG_SOURCE:  $FFMPEG_SOURCE  (btbn = ~140 MB, reliable; johnvansickle = ~40 MB but Cloudflare-protected)"
          echo "  BUNDLE_DENO:    $BUNDLE_DENO  (1 = bundle deno; yt-dlp requires it for JS extractors)"
          echo "  STRIP_BINARIES: $STRIP_BINARIES"
          echo "  REMOVE_PDB:     $REMOVE_PDB"
          echo "  SKIP_FFPLAY:    $SKIP_FFPLAY"
          echo "  SHRINK_ICU:     $SHRINK_ICU  (0 = keep ICU, safe)"
          echo ""
          echo "  Expected size:  ~171 MB (deno + johnvansickle ffmpeg) or ~271 MB (deno + btbn ffmpeg)"

      - name: Run build script
        working-directory: packaging/appimage
        run: |
          chmod +x build-appimage.sh AppRun
          ./build-appimage.sh "$ARCH"

      - name: Discover produced AppImage
        id: discover
        working-directory: packaging/appimage
        run: |
          set -e
          APPIMG="$(ls -1 Parabolic-*.AppImage 2>/dev/null | head -n1)"
          if [ -z "$APPIMG" ]; then
            echo "::error::No AppImage produced"
            exit 1
          fi
          chmod +x "$APPIMG"
          SIZE_BYTES=$(stat -c%s "$APPIMG")
          SIZE_MB=$((SIZE_BYTES / 1024 / 1024))
          echo "path=packaging/appimage/${APPIMG}" >> "$GITHUB_OUTPUT"
          echo "name=${APPIMG}" >> "$GITHUB_OUTPUT"
          echo "size=${SIZE_MB} MB" >> "$GITHUB_OUTPUT"
          echo "size_bytes=${SIZE_BYTES}" >> "$GITHUB_OUTPUT"
          echo ""
          echo "=== AppImage produced: $APPIMG ($SIZE_MB MB) ==="

      - name: Smoke-test the AppImage (extract only — FUSE is unavailable in runners)
        working-directory: packaging/appimage
        run: |
          APPIMG_NAME="${{ steps.discover.outputs.name }}"
          echo "== Extracting AppImage contents for sanity check =="
          chmod +x "$APPIMG_NAME"
          ./"$APPIMG_NAME" --appimage-extract 2>/dev/null || true
          echo "== Check that the .NET binary is in place =="
          test -x squashfs-root/usr/lib/org.nickvision.tubeconverter/Nickvision.Parabolic.GNOME
          echo "== Check that the bundled deps are in place =="
          for f in yt-dlp ffmpeg ffprobe aria2c; do
            test -e "squashfs-root/usr/lib/org.nickvision.tubeconverter/$f" && echo "  ✔ $f" || echo "  ✘ MISSING: $f"
          done
          echo "== Check deno (REQUIRED by yt-dlp — should be present by default) =="
          if [[ "$BUNDLE_DENO" == "1" ]]; then
            test -e "squashfs-root/usr/lib/org.nickvision.tubeconverter/deno" && echo "  ✔ deno bundled — yt-dlp JS extractors will work" || echo "  ✘ MISSING: deno (yt-dlp JS extractors will FAIL)"
          else
            test ! -e "squashfs-root/usr/lib/org.nickvision.tubeconverter/deno" && echo "  ✔ deno skipped (BUNDLE_DENO=0)" || echo "  ⚠ deno present despite BUNDLE_DENO=0"
            echo "  ⚠ WARNING: deno is required by yt-dlp for JS-based extractors (Bilibili, Niconico, some YouTube age-restricted videos, etc.)"
          fi
          echo "== Check ffplay (should be absent if SKIP_FFPLAY=1) =="
          if [[ "$SKIP_FFPLAY" == "1" ]]; then
            test ! -e "squashfs-root/usr/lib/org.nickvision.tubeconverter/ffplay" && echo "  ✔ ffplay skipped (SKIP_FFPLAY=1)" || echo "  ⚠ ffplay present despite SKIP_FFPLAY=1"
          fi
          echo "== Check GTK4 + libadwaita bundled =="
          test -e squashfs-root/usr/lib/libgtk-4.so.1 && echo "  ✔ libgtk-4.so.1" || echo "  ✘ MISSING: libgtk-4.so.1"
          test -e squashfs-root/usr/lib/libadwaita-1.so.0 && echo "  ✔ libadwaita-1.so.0" || echo "  ✘ MISSING: libadwaita-1.so.0"
          echo "== Check auto-updater installed (Yad-based) =="
          test -x squashfs-root/usr/bin/parabolic-updater && echo "  ✔ parabolic-updater installed" || echo "  ✘ MISSING: parabolic-updater"
          test -f squashfs-root/usr/share/parabolic-version.txt && echo "  ✔ version file present: $(cat squashfs-root/usr/share/parabolic-version.txt)" || echo "  ✘ MISSING: parabolic-version.txt"
          # Verify the GitHub owner was correctly substituted into the updater
          OWNER_IN_SCRIPT=$(grep '^PARABOLIC_UPDATE_OWNER=' squashfs-root/usr/bin/parabolic-updater | cut -d'"' -f2)
          [ "$OWNER_IN_SCRIPT" = "$GITHUB_OWNER" ] && echo "  ✔ updater checks github.com/$GITHUB_OWNER/parabolic/releases" || echo "  ⚠ updater owner mismatch: expected '$GITHUB_OWNER', got '$OWNER_IN_SCRIPT'"
          echo "== Check no .pdb / .dbg / .xml debug files (if REMOVE_PDB=1) =="
          if [[ "$REMOVE_PDB" == "1" ]]; then
            DBG_COUNT=$(find squashfs-root/usr/lib/org.nickvision.tubeconverter -maxdepth 1 \( -name "*.pdb" -o -name "*.dbg" -o -name "*.xml" \) | wc -l)
            [ "$DBG_COUNT" = "0" ] && echo "  ✔ no debug files" || echo "  ⚠ $DBG_COUNT debug files present"
          fi
          rm -rf squashfs-root

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.discover.outputs.name }}
          path: ${{ steps.discover.outputs.path }}
          if-no-files-found: error
          compression-level: 0  # AppImages are already compressed
          retention-days: 30

      - name: Generate SHA256 checksum
        working-directory: packaging/appimage
        run: |
          APPIMG_NAME="${{ steps.discover.outputs.name }}"
          sha256sum "$APPIMG_NAME" > "${APPIMG_NAME}.sha256"
          echo "Checksum:"
          cat "${APPIMG_NAME}.sha256"

      - name: Upload checksum artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.discover.outputs.name }}.sha256
          path: packaging/appimage/${{ steps.discover.outputs.name }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Attach AppImage to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.discover.outputs.path }}
            ${{ steps.discover.outputs.path }}.sha256
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Parabolic AppImage (${{ steps.discover.outputs.size }})

            **SHA256 checksum** — see the attached `.sha256` file.

